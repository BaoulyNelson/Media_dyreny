{% extends "base.html" %}
{% block titre %}Lien envoyé{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="auth-card text-center">
                <div class="auth-icon mb-3"><i class="bi bi-check-circle"></i></div>
                <h1 class="auth-title">Lien envoyé</h1>
                <p class="text-muted">Un e-mail de réinitialisation a été envoyé à votre adresse.</p>
                <a href="{% url 'accounts:connexion' %}" class="btn btn-accent mt-3">Retour à la connexion</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
