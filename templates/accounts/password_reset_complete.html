{% extends "base.html" %}
{% block titre %}Mot de passe réinitialisé{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="auth-card text-center">
                <div class="auth-icon mb-3"><i class="bi bi-check2-circle"></i></div>
                <h1 class="auth-title">Mot de passe réinitialisé</h1>
                <p class="text-muted">Votre mot de passe a bien été modifié. Vous pouvez maintenant vous reconnecter.</p>
                <a href="{% url 'accounts:connexion' %}" class="btn btn-accent mt-3">Se connecter</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
