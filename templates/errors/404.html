{% extends "base.html" %}
{% block titre %}Page introuvable{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Page introuvable</h1>
        <p class="text-muted mb-4">La page que vous recherchez n'existe pas ou a été déplacée.</p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="{% url 'articles:accueil' %}" class="btn btn-accent"><i class="bi bi-house me-2"></i>Accueil</a>
            <a href="{% url 'articles:liste' %}" class="btn btn-outline-primary"><i class="bi bi-newspaper me-2"></i>Actualités</a>
        </div>
    </div>
</div>
{% endblock %}
