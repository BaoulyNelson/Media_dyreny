{% extends "base.html" %}
{% block titre %}Supprimer l'article{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-danger border-2">
        <div class="card-body p-4 text-center">
          <i class="bi bi-exclamation-triangle-fill text-danger mb-3" style="font-size:3rem;"></i>
          <h3 class="mb-2">Confirmer la suppression</h3>
          <p class="text-muted mb-1">Vous êtes sur le point de supprimer définitivement l'article :</p>
          <p class="fw-bold mb-4">« {{ object.titre }} »</p>
          <p class="text-danger small mb-4"><i class="bi bi-exclamation-circle me-1"></i>Cette action est irréversible.</p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-3 justify-content-center">
              <a href="{% url 'articles:mes_articles' %}" class="btn btn-outline-secondary px-4">Annuler</a>
              <button type="submit" class="btn btn-danger px-4">
                <i class="bi bi-trash me-2"></i>Supprimer définitivement
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
